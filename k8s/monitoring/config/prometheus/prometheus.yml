global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kind-traininghub
    environment: pfe-demo

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: traininghub-services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - traininghub

    relabel_configs:
      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
        action: keep
        regex: "true"

      - source_labels:
          - __meta_kubernetes_pod_phase
        action: keep
        regex: Running

      - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_path
        action: replace
        target_label: __metrics_path__
        regex: "(.+)"

      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        target_label: __address__
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"

      - source_labels:
          - __meta_kubernetes_pod_label_app
        action: replace
        target_label: service

      - source_labels:
          - __meta_kubernetes_pod_name
        action: replace
        target_label: pod

      - source_labels:
          - __meta_kubernetes_namespace
        action: replace
        target_label: namespace
