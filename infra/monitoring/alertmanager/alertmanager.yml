global:
  resolve_timeout: 5m

route:
  receiver: aiops-webhook
  group_by:
    - alertname
    - service
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: aiops-webhook
    webhook_configs:
      - url: http://ai-ops-service:5005/api/v1/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager-secrets/aiops-token
