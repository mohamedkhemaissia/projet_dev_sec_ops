global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: traininghub-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service:5001
        labels:
          service: user-service
      - targets:
          - course-service:5002
        labels:
          service: course-service
      - targets:
          - certificate-service:5004
        labels:
          service: certificate-service
      - targets:
          - frontend-service:3000
        labels:
          service: frontend-service
      - targets:
          - ai-ops-service:5005
        labels:
          service: ai-ops-service
