name: DAST Shift Right

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL of the deployed staging environment to scan
        required: true
        type: string
  workflow_run:
    workflows:
      - CD Kubernetes
    branches:
      - main
    types:
      - completed
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (vars.DAST_TARGET_URL != '' &&
      (github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || vars.DAST_TARGET_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target URL
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET_URL}" in
            http://*|https://*) ;;
            *)
              echo "TARGET_URL must start with http:// or https://" >&2
              exit 1
              ;;
          esac

      - name: Run OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: traininghub-zap-report
          cmd_options: "-a"

      - name: Explain initial DAST policy
        run: >-
          echo "The baseline report is collected as evidence.
          Review and classify its findings before changing fail_action to true."
