name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 bandit
          pip install -r services/user-service/requirements.txt
          pip install -r services/course-service/requirements.txt
          pip install -r services/certificate-service/requirements.txt
          pip install -r services/frontend-service/requirements.txt
          pip install -r requirements-test.txt

      - name: Flake8 check
        run: flake8 services tests --max-line-length=120 --extend-ignore=E501,W503

      - name: Pytest with coverage threshold
        run: |
          python -m pytest tests -v \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=55
          python -m pytest services/frontend-service/tests -v

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traininghub-coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Bandit check
        run: bandit -r services -x services/frontend-service/tests

      - name: pip-audit dependency scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: >-
            services/user-service/requirements.txt
            services/course-service/requirements.txt
            services/certificate-service/requirements.txt
            services/frontend-service/requirements.txt

  infrastructure-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - name: Render production and monitoring manifests
        run: |
          mkdir -p rendered
          kubectl kustomize k8s/overlays/production \
            --load-restrictor=LoadRestrictionsNone \
            > rendered/traininghub-production.yaml
          kubectl kustomize k8s/monitoring \
            > rendered/traininghub-monitoring.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f rendered/traininghub-production.yaml \
            -f rendered/traininghub-monitoring.yaml

      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "${PWD}/infra/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "${PWD}/k8s/monitoring/config/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool \
            -v "${PWD}/k8s/monitoring/config/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Trivy IaC security scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: rendered
          format: table
          severity: CRITICAL
          exit-code: "1"

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
      - infrastructure-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build user-service
        run: docker build -f infra/docker/user-service.Dockerfile -t user-service:latest .

      - name: Build course-service
        run: docker build -f infra/docker/course-service.Dockerfile -t course-service:latest .

      - name: Build certificate-service
        run: docker build -f infra/docker/certificate-service.Dockerfile -t certificate-service:latest .

      - name: Build frontend-service
        run: docker build -f infra/docker/frontend-service.Dockerfile -t frontend-service:latest .

      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout scan on user-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://user-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true

      - name: Docker Scout scan on course-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://course-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true

      - name: Docker Scout scan on certificate-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://certificate-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true

      - name: Docker Scout scan on frontend-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://frontend-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}" >> $GITHUB_ENV

      - name: Build and push user-service
        run: |
          docker build -f infra/docker/user-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/user-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/user-service:latest .
          docker push ${{ env.IMAGE_PREFIX }}/user-service:${{ github.run_number }}
          docker push ${{ env.IMAGE_PREFIX }}/user-service:latest

      - name: Build and push course-service
        run: |
          docker build -f infra/docker/course-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/course-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/course-service:latest .
          docker push ${{ env.IMAGE_PREFIX }}/course-service:${{ github.run_number }}
          docker push ${{ env.IMAGE_PREFIX }}/course-service:latest

      - name: Build and push certificate-service
        run: |
          docker build -f infra/docker/certificate-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/certificate-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/certificate-service:latest .
          docker push ${{ env.IMAGE_PREFIX }}/certificate-service:${{ github.run_number }}
          docker push ${{ env.IMAGE_PREFIX }}/certificate-service:latest

      - name: Build and push frontend-service
        run: |
          docker build -f infra/docker/frontend-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/frontend-service:latest .
          docker push ${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.run_number }}
          docker push ${{ env.IMAGE_PREFIX }}/frontend-service:latest
