name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # 1. QUALITY & APPLICATION SECURITY
  # ============================================================
  quality:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-only-key
      JWT_SECRET_KEY: test-only-jwt-key
      MYSQL_PASSWORD: test-only-password
      DEFAULT_ADMIN_PASSWORD: test-only-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 bandit
          pip install -r services/user-service/requirements.txt
          pip install -r services/course-service/requirements.txt
          pip install -r services/certificate-service/requirements.txt
          pip install -r services/frontend-service/requirements.txt
          pip install -r requirements-test.txt

      - name: Flake8 check
        if: false
        run: |
          flake8 services tests \
            --max-line-length=120 \
            --extend-ignore=E501,W503

      - name: Pytest with coverage threshold
        run: |
          python -m pytest tests -v \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=55

          python -m pytest services/frontend-service/tests -v

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traininghub-coverage-html
          path: htmlcov/
          if-no-files-found: error

      - name: Bandit check
        run: |
          bandit -r services \
            -x services/frontend-service/tests

      - name: pip-audit dependency scan
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: >-
            services/user-service/requirements.txt
            services/course-service/requirements.txt
            services/certificate-service/requirements.txt
            services/frontend-service/requirements.txt


  # ============================================================
  # 2. INFRASTRUCTURE SECURITY
  # ============================================================
  infrastructure-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - name: Prepare application manifests
        run: |
          mkdir -p rendered

          cp k8s/namespace.yaml rendered/01-traininghub-namespace.yaml
          cp k8s/app-config.yaml rendered/02-traininghub-app-config.yaml
          kubectl create configmap mysql-initdb \
            --namespace traininghub \
            --from-file=init.sql=k8s/init.sql \
            --dry-run=client -o yaml \
            > rendered/03-traininghub-mysql-initdb.yaml
          cp k8s/mysql.yaml rendered/04-traininghub-mysql.yaml
          cp k8s/user-service.yaml rendered/05-traininghub-user-service.yaml
          cp k8s/course-service.yaml rendered/06-traininghub-course-service.yaml
          cp k8s/certificate-service.yaml rendered/07-traininghub-certificate-service.yaml
          cp k8s/frontend.yaml rendered/08-traininghub-frontend.yaml
          sed -i '/- name: SESSION_COOKIE_SECURE/{n;s/value: "false"/value: "true"/;}' \
            rendered/08-traininghub-frontend.yaml
          grep -A1 -F 'name: SESSION_COOKIE_SECURE' rendered/08-traininghub-frontend.yaml \
            | grep -qF 'value: "true"'

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm \
            -v "${PWD}/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            /manifests/01-traininghub-namespace.yaml \
            /manifests/02-traininghub-app-config.yaml \
            /manifests/03-traininghub-mysql-initdb.yaml \
            /manifests/04-traininghub-mysql.yaml \
            /manifests/05-traininghub-user-service.yaml \
            /manifests/06-traininghub-course-service.yaml \
            /manifests/07-traininghub-certificate-service.yaml \
            /manifests/08-traininghub-frontend.yaml

      - name: Trivy IaC security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          format: table
          severity: CRITICAL
          exit-code: "1"


  # ============================================================
  # 3. BUILD + IMAGE SECURITY + DAST
  # ============================================================
  build:
    runs-on: ubuntu-latest

    needs:
      - quality
      - infrastructure-security

    env:
      SECRET_KEY: zap-test-secret-key
      JWT_SECRET_KEY: zap-test-jwt-key

      MYSQL_ROOT_PASSWORD: zap-test-root-password
      MYSQL_PASSWORD: zap-test-mysql-password

      DEFAULT_ADMIN_PASSWORD: zap-test-admin-password
      FRONTEND_SECRET_KEY: zap-test-frontend-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build user-service
        run: |
          docker build --pull \
            -f infra/docker/user-service.Dockerfile \
            -t user-service:latest .

      - name: Build course-service
        run: |
          docker build --pull \
            -f infra/docker/course-service.Dockerfile \
            -t course-service:latest .

      - name: Build certificate-service
        run: |
          docker build --pull \
            -f infra/docker/certificate-service.Dockerfile \
            -t certificate-service:latest .

      - name: Build frontend-service
        run: |
          docker build --pull \
            -f infra/docker/frontend-service.Dockerfile \
            -t frontend-service:latest .


      # --------------------------------------------------------
      # Docker Scout
      # --------------------------------------------------------

      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout scan on user-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://user-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false

      - name: Docker Scout scan on course-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://course-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false

      - name: Docker Scout scan on certificate-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://certificate-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false

      - name: Docker Scout scan on frontend-service
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://frontend-service:latest
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false


      # --------------------------------------------------------
      # Start TrainingHub for DAST
      # --------------------------------------------------------

      - name: Start TrainingHub for DAST
        run: |
          docker compose up -d --no-build \
            mysql \
            user-service \
            course-service \
            certificate-service \
            frontend-service

          docker compose ps


      # --------------------------------------------------------
      # Wait until TrainingHub is ready
      # --------------------------------------------------------

      - name: Wait for TrainingHub
        run: |
          echo "Waiting for TrainingHub..."

          for i in {1..30}; do

            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "TrainingHub is ready."
              exit 0
            fi

            echo "Attempt $i/30..."
            sleep 5

          done

          echo "TrainingHub failed to start."

          docker compose ps
          docker compose logs

          exit 1


      # --------------------------------------------------------
      # Prepare ZAP reports
      # --------------------------------------------------------

      - name: Prepare ZAP report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports


      # --------------------------------------------------------
      # OWASP ZAP - DAST Baseline
      # --------------------------------------------------------

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap-baseline-report.html \
            -J zap-baseline-report.json \
            -I


      # --------------------------------------------------------
      # Store DAST report
      # --------------------------------------------------------

      - name: Upload ZAP DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traininghub-zap-baseline
          path: zap-reports/
          if-no-files-found: warn


      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------

      - name: Stop TrainingHub
        if: always()
        run: |
          docker compose down -v


  # ============================================================
  # 4. PUBLISH IMAGES TO GHCR
  # ============================================================
  publish:
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}" \
            >> $GITHUB_ENV

      - name: Build and push user-service
        run: |
          docker build --pull \
            -f infra/docker/user-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/user-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/user-service:latest .

          docker push \
            ${{ env.IMAGE_PREFIX }}/user-service:${{ github.run_number }}

          docker push \
            ${{ env.IMAGE_PREFIX }}/user-service:latest

      - name: Build and push course-service
        run: |
          docker build --pull \
            -f infra/docker/course-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/course-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/course-service:latest .

          docker push \
            ${{ env.IMAGE_PREFIX }}/course-service:${{ github.run_number }}

          docker push \
            ${{ env.IMAGE_PREFIX }}/course-service:latest

      - name: Build and push certificate-service
        run: |
          docker build --pull \
            -f infra/docker/certificate-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/certificate-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/certificate-service:latest .

          docker push \
            ${{ env.IMAGE_PREFIX }}/certificate-service:${{ github.run_number }}

          docker push \
            ${{ env.IMAGE_PREFIX }}/certificate-service:latest

      - name: Build and push frontend-service
        run: |
          docker build --pull \
            -f infra/docker/frontend-service.Dockerfile \
            -t ${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.run_number }} \
            -t ${{ env.IMAGE_PREFIX }}/frontend-service:latest .

          docker push \
            ${{ env.IMAGE_PREFIX }}/frontend-service:${{ github.run_number }}

          docker push \
            ${{ env.IMAGE_PREFIX }}/frontend-service:latest
